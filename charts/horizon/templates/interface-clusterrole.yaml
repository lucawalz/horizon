{{- if and .Values.ui.enabled .Values.ui.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "horizon.interfaceFullname" . }}
  labels:
    {{- include "horizon.interfaceLabels" . | nindent 4 }}
rules:
{{- $scopes := dict "users" .Values.ui.rbac.impersonateUsers "groups" .Values.ui.rbac.impersonateGroups }}
{{- range $resource, $names := $scopes }}
  - apiGroups:
      - ""
    resources:
      - {{ $resource }}
    verbs:
      - impersonate
    {{- with $names }}
    resourceNames:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
{{- end }}
