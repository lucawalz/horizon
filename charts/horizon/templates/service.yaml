apiVersion: v1
kind: Service
metadata:
  name: {{ include "horizon.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "horizon.controllerLabels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "horizon.controllerSelectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
