                  rule: (has(self.mode) && self.mode == 'replicate') == has(self.burstReplicas)
                - message: mode is immutable
                  rule: has(self.mode) == has(oldSelf.mode) && (!has(self.mode) ||
                    self.mode == oldSelf.mode)
            required:
