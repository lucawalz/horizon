            - message: set exactly one of size or requirements
              rule: has(self.size) != has(self.requirements)
            - message: providerRef is immutable
              rule: self.providerRef == oldSelf.providerRef
            - message: region is immutable
              rule: self.region == oldSelf.region
            - message: size is immutable
              rule: has(self.size) == has(oldSelf.size) && (!has(self.size) || self.size
