name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    uses: lucawalz/.github/.github/workflows/release.yml@512d402b682a017ae2629ee41f794686a8d1468c # v0.1.0
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      goreleaser: true
      attest-subject-path: horizon_*
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
