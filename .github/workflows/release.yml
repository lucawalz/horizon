name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lucawalz/horizon
  CHART_REGISTRY: oci://ghcr.io/lucawalz/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: chart
        name: tag matches the chart version
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "release runs only on a v-prefixed tag ref, got $GITHUB_REF" >&2
              exit 1
              ;;
          esac
          tag_version="${GITHUB_REF_NAME#v}"
          chart_version="$(awk '$1 == "version:" { print $2; exit }' charts/horizon/Chart.yaml)"
          if [ "$tag_version" != "$chart_version" ]; then
            echo "tag $GITHUB_REF_NAME wants $tag_version but charts/horizon/Chart.yaml declares $chart_version" >&2
            exit 1
          fi
          echo "version=$chart_version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - uses: azure/setup-helm@v5
      - name: publish chart
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin <<<"$REGISTRY_TOKEN"
          helm package charts/horizon
          helm push "horizon-${CHART_VERSION}.tgz" "$CHART_REGISTRY"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: tools
        run: echo "goreleaser=$(make -s print-GORELEASER_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ steps.tools.outputs.goreleaser }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
