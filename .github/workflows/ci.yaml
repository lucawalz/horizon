name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: cache envtest control plane binaries
        uses: actions/cache@v6
        with:
          path: bin/k8s
          key: envtest-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - run: make tidy-check
      - run: make vet
      - run: make build
      - run: make manifests-check
      - run: make test
      - run: make test-race

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make adr-check
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make lint

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: internal/web/site/.nvmrc
          cache: npm
          cache-dependency-path: internal/web/site/package-lock.json
      - run: make site

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make release-check

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: make chart-lint

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: make image
        env:
          VERSION: ${{ github.sha }}

  notify:
    needs: [test, lint, site, release-config, chart, image]
    if: failure() && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - run: |
          gh pr edit "$PR_URL" --add-assignee lucawalz
          gh pr comment "$PR_URL" --edit-last --create-if-none --body "Dependabot update failed CI - manual review required."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
