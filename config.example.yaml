kubeconfig: ""

# target kubeconfig context; the --context flag overrides it
# context: ""

cluster: burst

pools:
  # namespace where the CAPI provider's MachineDeployments live; set to the chosen provider's namespace
  namespace: caph-system
  default_type: reserved
  types:
    reserved: reserved-workers

# reserved:
#   # token and cloud_init each resolve from exactly one of value, path, env, or secret
#   # value: an inline literal
#   # path:  a file on disk (~ expands to the home dir)
#   # env:   the name of an environment variable to read
#   # secret: a single key in a kubernetes secret; the referenced value is used verbatim,
#   #         so the secret must already hold a clean cloud-init, not a provider-specific blob
#   token:
#     env: HCLOUD_TOKEN
#     # value: hcloud-token
#     # path: ~/.config/horizon/hcloud-token
#     # secret: { namespace: caph-system, name: hcloud, key: token }
#   # the cloud-init must already carry the horizon.dev/pool=reserved node label
#   cloud_init:
#     path: ~/.config/horizon/reserved-cloud-init.yaml
#     # value: |
#     #   #cloud-config
#     # env: HORIZON_RESERVED_CLOUD_INIT
#     # secret: { namespace: caph-system, name: reserved-cloud-init, key: cloud-init }
#   # image.value selects the boot image by label; required before a reserved server can be provisioned
#   image:
#     label: caph-image-name
#     value: ""
#   ssh_keys: []
